openapi: 3.0.3
info:
  title: batch-jobs HTTP API
  description: >
    REST API for enqueueing, inspecting, listing, cancelling, and retrying
    jobs, backed by a queue/sqlite.Queue (or any internal/api.Store
    implementation), plus cron-driven recurring schedules when the server
    is configured with a schedule store.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
security:
  - ApiKeyAuth: []
paths:
  /healthz:
    get:
      summary: Liveness probe
      description: Always returns 200 once the process is serving. Exempt from auth.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /metrics:
    get:
      summary: Prometheus scrape endpoint
      description: Present only when the server is configured with a Metrics collector.
      responses:
        "200":
          description: Metrics in Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
  /v1/jobs:
    post:
      summary: Enqueue a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueRequest"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "200":
          description: >
            idempotency_key matched an existing job for the same queue; the
            existing job is returned unchanged and no new job was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/QueueFull"
    get:
      summary: List jobs by status
      parameters:
        - name: status
          in: query
          required: true
          description: One of pending, running, succeeded, failed, retrying, dead, cancelled.
          schema:
            $ref: "#/components/schemas/Status"
        - name: limit
          in: query
          required: false
          description: Maximum number of jobs to return. Defaults to 50, capped at 500.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Matching jobs, most recently updated first
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/jobs/{id}:
    get:
      summary: Get a job by ID
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/jobs/{id}/cancel:
    post:
      summary: Cancel a pending or retrying job
      description: >
        Only jobs in status pending or retrying can be cancelled. A job
        already claimed by a worker, or already in a terminal state, returns
        409.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "204":
          description: Job cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Job exists but is not cancelable in its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/jobs/{id}/retry:
    post:
      summary: Retry a dead or failed job
      description: >
        Only jobs in status dead or failed can be retried. Retrying resets
        retry_count to 0, clears last_error, and moves the job back to
        pending with run_at reset to now. Any other status returns 409.
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "204":
          description: Job reset to pending
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Job exists but is not retryable in its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/schedules:
    post:
      summary: Create a recurring schedule
      description: >
        Registers a cron expression and the job template every firing is
        stamped from. Each time the expression comes due, the server
        enqueues a fresh job carrying the schedule's payload, priority,
        retry budget, and timeout onto its queue.


        A new schedule is enabled, so it starts firing as soon as its
        expression next comes due. Use the trigger endpoint if the first
        job should not wait for that.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
      responses:
        "201":
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/SchedulingDisabled"
    get:
      summary: List every schedule
      description: >
        Returns all schedules, most recently created first. There is no
        limit or filter: a schedule set is written by people and stays
        small, and an operator asking what is scheduled wants all of it.
      responses:
        "200":
          description: The schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedules:
                    type: array
                    items:
                      $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/SchedulingDisabled"
  /v1/schedules/{id}:
    get:
      summary: Get a schedule by ID
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      responses:
        "200":
          description: The schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/SchedulingDisabled"
    patch:
      summary: Edit a schedule
      description: >
        Applies a partial edit. A field the body omits is left as it is
        rather than reset to its zero value, which is what makes this a
        patch rather than a replacement.


        Changing `cron` recomputes `next_run_at` from now; a body that
        does not change it leaves the next firing where it was, so
        adjusting a retry budget cannot silently postpone tonight's run.
        An expression that will not parse is rejected with 400 and nothing
        is written, so the stored schedule is never left half edited.


        Whether a schedule is enabled is not editable here: that belongs
        to the pause and resume endpoints, so an edit built from a copy
        read before a pause cannot silently resurrect it.
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleRequest"
      responses:
        "200":
          description: The schedule as it stands after the edit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/SchedulingDisabled"
    delete:
      summary: Delete a schedule
      description: >
        Removes the schedule permanently. Jobs it has already produced are
        untouched: they are ordinary jobs by then.


        Deleting a schedule that does not exist also returns 204, which
        makes the call idempotent: a client retrying after a lost response
        gets the same answer rather than a 404 it has to interpret.
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      responses:
        "204":
          description: Deleted, or already absent
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/SchedulingDisabled"
  /v1/schedules/{id}/pause:
    post:
      summary: Stop a schedule firing
      description: >
        A paused schedule accumulates no missed firings: the time it is
        paused for simply does not happen. Pausing an already-paused
        schedule is a no-op.
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      responses:
        "204":
          description: Paused
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/SchedulingDisabled"
  /v1/schedules/{id}/resume:
    post:
      summary: Re-enable a paused schedule
      description: >
        Recomputes `next_run_at` from now before re-enabling. Without
        that, a schedule paused for a week would come back a week overdue
        and fire the instant it resumed -- exactly the surprise pausing it
        was meant to avoid. Resuming an already-enabled schedule changes
        nothing.
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      responses:
        "204":
          description: Resumed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/SchedulingDisabled"
  /v1/schedules/{id}/trigger:
    post:
      summary: Run a schedule now
      description: >
        Enqueues the job the schedule produces immediately and returns it,
        leaving the timetable untouched: `next_run_at` does not move and
        `last_run_at` is not set, because this was not a firing.


        It is what "run it now" means -- checking a newly written schedule
        without waiting until tomorrow, or re-running a nightly job after
        fixing whatever it was waiting on. It works on a paused schedule
        too, since pausing stops the timetable rather than the operator.
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      responses:
        "201":
          description: The job the schedule produced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          $ref: "#/components/responses/SchedulingDisabled"
        "503":
          $ref: "#/components/responses/QueueFull"
  /v1/recover:
    post:
      summary: Reclaim jobs whose worker died holding them
      description: >
        A worker claims a job under a time-bounded lease and extends it by
        heartbeating while it runs. If the worker's process dies, nothing
        reports an outcome and the job would otherwise sit in status
        running forever. Recovery reclaims every job whose lease has
        expired: each is returned to pending for another attempt, or moved
        to dead if its retries are already spent.


        A reaper normally does this on a schedule; this endpoint is for
        when waiting for the next sweep is not acceptable, such as an
        operator who has just confirmed a host is gone. It is safe to call
        at any time and while workers are running: a job whose worker is
        alive and heartbeating is never touched.
      responses:
        "200":
          description: Recovery pass complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  requeued:
                    type: integer
                    description: Orphaned jobs returned to pending.
                    example: 3
                  dead_lettered:
                    type: integer
                    description: Orphaned jobs with no retries left, moved to dead.
                    example: 1
                  remaining:
                    type: integer
                    description: >
                      Expired claims still outstanding after the pass,
                      normally 0. A non-zero value means orphans are being
                      created faster than one pass can clear them.
                    example: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":
          description: The configured store does not lease jobs and has nothing to recover
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/events:
    get:
      summary: Live job-count stats via Server-Sent Events
      description: >
        Streams a StatsResponse-shaped `data:` frame on connect and again
        every EventInterval (default 2s) until the client disconnects.
        Powers the dashboard's live-updating stat tiles without polling.
      responses:
        "200":
          description: text/event-stream of StatsResponse JSON frames
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: Streaming unsupported by the underlying ResponseWriter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/stats:
    get:
      summary: Job counts by status
      responses:
        "200":
          description: Number of jobs currently in each status
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    additionalProperties:
                      type: integer
                    example:
                      pending: 3
                      succeeded: 128
                      dead: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Required only when the server is started with -auth-token (or
        Server.AuthToken is set). Disabled by default.
  parameters:
    JobID:
      name: id
      in: path
      required: true
      schema:
        type: string
    ScheduleID:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    Status:
      type: string
      enum:
        - pending
        - running
        - succeeded
        - failed
        - retrying
        - dead
        - cancelled
    Priority:
      type: integer
      enum: [-1, 0, 1]
      description: -1 = low, 0 = normal, 1 = high
    Job:
      type: object
      properties:
        id:
          type: string
        queue:
          type: string
        payload:
          type: string
          format: byte
          description: Base64-encoded opaque payload.
        status:
          $ref: "#/components/schemas/Status"
        priority:
          $ref: "#/components/schemas/Priority"
        max_retries:
          type: integer
        retry_count:
          type: integer
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        run_at:
          type: string
          format: date-time
        timeout_seconds:
          type: integer
          description: >
            Bounds how long a single execution attempt may run before the
            worker cancels its context. 0 means no per-attempt timeout.
        idempotency_key:
          type: string
          description: >
            Opaque caller-supplied key. A repeated Enqueue with the same
            (queue, idempotency_key) pair returns this job instead of
            creating a duplicate.
    EnqueueRequest:
      type: object
      required: [queue]
      properties:
        queue:
          type: string
        payload:
          type: string
          format: byte
        priority:
          $ref: "#/components/schemas/Priority"
        max_retries:
          type: integer
          minimum: 0
        delay_seconds:
          type: integer
          minimum: 0
          description: Delays the job's earliest eligible run time by this many seconds.
        timeout_seconds:
          type: integer
          minimum: 0
          description: >
            Bounds how long a single execution attempt may run. 0 (the
            default) means no per-attempt timeout.
        idempotency_key:
          type: string
          description: >
            Opaque key scoping this request's dedupe: a repeated request
            with the same (queue, idempotency_key) pair is a no-op that
            returns the original job (200) instead of creating a new one
            (201).
    Cron:
      type: string
      description: >
        A standard five-field cron expression: minute, hour, day of month,
        month, day of week. Each field accepts "*", a single value, a
        comma-separated list, a "lo-hi" range, or any of those with a
        "/step" suffix. Day-of-month and day-of-week combine per standard
        cron semantics: if only one is restricted it alone decides whether
        a day matches; if both are, a day matches when either does.
      example: "0 3 * * 1-5"
    Schedule:
      type: object
      properties:
        id:
          type: string
        queue:
          type: string
          description: The queue every job this schedule produces goes onto.
        cron:
          $ref: "#/components/schemas/Cron"
        payload:
          type: string
          format: byte
          description: Base64-encoded payload copied onto every produced job.
        priority:
          $ref: "#/components/schemas/Priority"
        max_retries:
          type: integer
        timeout_seconds:
          type: integer
          description: >
            Bounds a single attempt of every produced job. 0 means no
            per-attempt timeout.
        enabled:
          type: boolean
          description: >
            False for a paused schedule, which is skipped rather than
            accumulating missed firings.
        next_run_at:
          type: string
          format: date-time
          description: >
            When the schedule is next due. A time in the past means the
            scheduler has not caught up yet, which on a healthy server is
            momentary.
        last_run_at:
          type: string
          format: date-time
          description: >
            When the schedule last fired. Absent entirely -- rather than
            the zero time -- for one that never has.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        upcoming:
          type: array
          description: >
            The next three fire times, starting at next_run_at. It answers
            the question a cron expression by itself does not: when does
            this actually run.
          items:
            type: string
            format: date-time
    CreateScheduleRequest:
      type: object
      required: [queue, cron]
      properties:
        queue:
          type: string
        cron:
          $ref: "#/components/schemas/Cron"
        payload:
          type: string
          format: byte
        priority:
          $ref: "#/components/schemas/Priority"
        max_retries:
          type: integer
          minimum: 0
        timeout_seconds:
          type: integer
          minimum: 0
    UpdateScheduleRequest:
      type: object
      description: >
        A partial edit. Every property is optional, and an omitted one is
        left unchanged rather than reset.
      properties:
        queue:
          type: string
          minLength: 1
        cron:
          $ref: "#/components/schemas/Cron"
        payload:
          type: string
          format: byte
        priority:
          $ref: "#/components/schemas/Priority"
        max_retries:
          type: integer
          minimum: 0
        timeout_seconds:
          type: integer
          minimum: 0
    Error:
      type: object
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Malformed or invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid X-API-Key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No job with the given ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ScheduleNotFound:
      description: No schedule with the given ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SchedulingDisabled:
      description: >
        This server was not configured with a schedule store. The routes
        are still mounted and answer 501 rather than 404, so a client can
        tell "this server does not schedule" from "you asked for a path
        that does not exist".
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded for this client IP
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Unexpected server-side error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QueueFull:
      description: >
        The backing queue is at capacity and is applying backpressure. The
        request was valid and is expected to succeed once workers drain the
        backlog, so clients should retry after the interval advertised in
        the Retry-After header rather than treating this as a failure.
      headers:
        Retry-After:
          description: Seconds to wait before retrying the request.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
